["Rotate Array","3 reversals, O(n) time O(1) space",`void rotate(int[] a,int k){
  int n=a.length; k%=n;
  rev(a,0,n-1); rev(a,0,k-1); rev(a,k,n-1);
}
void rev(int[] a,int i,int j){while(i<j){int t=a[i];a[i++]=a[j];a[j--]=t;}}`],
["Second Largest","Single pass, two variables",`int second(int[] a){
  int m=Integer.MIN_VALUE,s=Integer.MIN_VALUE;
  for(int x:a){ if(x>m){s=m;m=x;} else if(x>s&&x!=m) s=x; }
  return s;
}`],
["Remove Duplicates (Sorted)","Two pointers, in place",`int rm(int[] a){
  int k=1;
  for(int i=1;i<a.length;i++) if(a[i]!=a[k-1]) a[k++]=a[i];
  return k;
}`],
["Merge Sorted Arrays","Two pointers",`int[] merge(int[] a,int[] b){
  int[] r=new int[a.length+b.length]; int i=0,j=0,k=0;
  while(i<a.length&&j<b.length) r[k++]=a[i]<=b[j]?a[i++]:b[j++];
  while(i<a.length) r[k++]=a[i++];
  while(j<b.length) r[k++]=b[j++];
  return r;
}`],
["Prefix Sum","Range sum in O(1) after O(n) build",`int[] p=new int[n+1];
for(int i=0;i<n;i++) p[i+1]=p[i]+a[i];
int range(int l,int r){ return p[r+1]-p[l]; }`],
["Palindrome String","Two pointers from both ends",`boolean pal(String s){
  int i=0,j=s.length()-1;
  while(i<j) if(s.charAt(i++)!=s.charAt(j--)) return false;
  return true;
}`],
["Valid Anagram","Count array of 26",`boolean ana(String a,String b){
  if(a.length()!=b.length()) return false;
  int[] c=new int[26];
  for(int i=0;i<a.length();i++){c[a.charAt(i)-'a']++;c[b.charAt(i)-'a']--;}
  for(int x:c) if(x!=0) return false;
  return true;
}`],
["Reverse Words","split + reverse + join",`String rw(String s){
  String[] w=s.trim().split(" +");
  Collections.reverse(Arrays.asList(w));
  return String.join(" ",w);

"Hashing & Window":{tip:"HashMap/HashSet se O(n^2) → O(n). Sorted array + pair → two pointers. Contiguous subarray/substring → sliding window ya prefix sum + map.",
items:[
["Two Sum","Map: value → index",`int[] two(int[] a,int t){
  Map<Integer,Integer> m=new HashMap<>();
  for(int i=0;i<a.length;i++){
    Integer j=m.get(t-a[i]);
    if(j!=null) return new int[]{j,i};

}`],
["First Non-Repeating Char","Count pass, then check pass",`char first(String s){

  for(char ch:s.toCharArray()) c[ch]++;

["Frequency / Duplicates","merge() counts; HashSet.add false = duplicate",`Map<Integer,Integer> f=new HashMap<>();
for(int x:a) f.merge(x,1,Integer::sum);
// duplicates: entries with value > 1
Set<Integer> seen=new HashSet<>();

["Pair with Given Sum (Sorted)","Two pointers",`boolean pair(int[] a,int t){
  int i=0,j=a.length-1;
  while(i<j){int s=a[i]+a[j];
    if(s==t) return true;
    if(s<t) i++; else j--;}
  return false;
}`],
["Longest Substring Without Repeat","Sliding window + last index map",`int lsub(String s){
  Map<Character,Integer> m=new HashMap<>(); int l=0,best=0;
  for(int r=0;r<s.length();r++){
    char c=s.charAt(r);
    if(m.containsKey(c)) l=Math.max(l,m.get(c)+1);
    m.put(c,r); best=Math.max(best,r-l+1);
  }
  return best;
}`],
["Max Sum of Size-k Window","Fixed window: add new, drop old",`int win(int[] a,int k){
  int s=0; for(int i=0;i<k;i++) s+=a[i];
  int b=s;
  for(int i=k;i<a.length;i++){ s+=a[i]-a[i-k]; b=Math.max(b,s); }
  return b;
}`],
["Subarray Sum Equals K","Prefix sum + map of counts",`int sub(int[] a,int k){
  Map<Integer,Integer> m=new HashMap<>(); m.put(0,1);
  int s=0,c=0;
  for(int x:a){ s+=x; c+=m.getOrDefault(s-k,0); m.merge(s,1,Integer::sum); }
  return c;
}`]]},
"Linked List":{tip:"Pointers: prev/curr/next. Dummy node se head edge cases bachte hain. Slow-fast pointer = middle, cycle.",
items:[
["Reverse Linked List","prev, curr, next",`class ListNode{int val;ListNode next;ListNode(int v){val=v;}}
ListNode rev(ListNode h){
  ListNode p=null;
  while(h!=null){ListNode n=h.next;h.next=p;p=h;h=n;}
  return p;
}`],
["Middle of List","Slow + fast pointer",`ListNode mid(ListNode h){
  ListNode s=h,f=h;
  while(f!=null&&f.next!=null){s=s.next;f=f.next.next;}
  return s;
}`],
["Detect Cycle","Floyd: fast meets slow if cycle",`boolean cyc(ListNode h){
  ListNode s=h,f=h;
  while(f!=null&&f.next!=null){
    s=s.next; f=f.next.next;
    if(s==f) return true;
  }
  return false;
}`],
["Merge Two Sorted Lists","Dummy node",`ListNode merge(ListNode a,ListNode b){
  ListNode d=new ListNode(0),t=d;
  while(a!=null&&b!=null){
    if(a.val<=b.val){t.next=a;a=a.next;} else {t.next=b;b=b.next;}
    t=t.next;
  }
  t.next=a!=null?a:b; return d.next;
}`],
["Remove Nth From End","Gap of n between two pointers",`ListNode rmN(ListNode h,int n){
  ListNode d=new ListNode(0); d.next=h; ListNode f=d,s=d;
  for(int i=0;i<n;i++) f=f.next;
  while(f.next!=null){f=f.next;s=s.next;}
  s.next=s.next.next; return d.next;
}`]]},
"Stack & Queue":{tip:"Java: Deque<Integer> st=new ArrayDeque<>() (push/pop/peek). Queue<Integer> q=new LinkedList<>() (add/poll). Matching / next greater → stack.",
items:[
["Balanced Parentheses","Push opens, pop on close",`boolean bal(String s){
  Deque<Character> st=new ArrayDeque<>();
  for(char c:s.toCharArray()){
    if("([{".indexOf(c)>=0) st.push(c);
    else{
      if(st.isEmpty()) return false;
      if("([{".indexOf(st.pop())!=")]}".indexOf(c)) return false;
    }
  }
  return st.isEmpty();
}`],
["Next Greater Element","Monotonic stack of indices, O(n)",`int[] nge(int[] a){
  int[] r=new int[a.length]; Arrays.fill(r,-1);
  Deque<Integer> st=new ArrayDeque<>();
  for(int i=0;i<a.length;i++){
    while(!st.isEmpty()&&a[st.peek()]<a[i]) r[st.pop()]=a[i];
    st.push(i);
  }
  return r;
}`],
["Queue using Two Stacks","Move in→out only when out empty",`class MyQ{
  Deque<Integer> in=new ArrayDeque<>(),out=new ArrayDeque<>();
  void push(int x){in.push(x);}
  int pop(){peek();return out.pop();}
  int peek(){
    if(out.isEmpty()) while(!in.isEmpty()) out.push(in.pop());
    return out.peek();
  }
}`]]},
"Sort, Search & Math":{tip:"Bubble/Selection/Insertion O(n^2); Merge O(n log n) stable; Quick avg O(n log n). Binary search sirf sorted data pe. Math: loops till sqrt(n).",
items:[
["Binary Search","O(log n); mid = l+(h-l)/2",`int bs(int[] a,int t){
  int l=0,h=a.length-1;
  while(l<=h){
    int m=l+(h-l)/2;
    if(a[m]==t) return m;
    if(a[m]<t) l=m+1; else h=m-1;
  }
  return -1;
}`],
["Merge Sort","Divide, sort halves, merge",`void ms(int[] a,int l,int r){
  if(l>=r) return;
  int m=(l+r)/2; ms(a,l,m); ms(a,m+1,r);
  int[] t=new int[r-l+1]; int i=l,j=m+1,k=0;
  while(i<=m&&j<=r) t[k++]=a[i]<=a[j]?a[i++]:a[j++];
  while(i<=m) t[k++]=a[i++];
  while(j<=r) t[k++]=a[j++];
  System.arraycopy(t,0,a,l,t.length);
}`],
["Quick Sort","Pivot = last, partition",`void qs(int[] a,int l,int h){
  if(l>=h) return;
  int p=a[h],i=l;
  for(int j=l;j<h;j++) if(a[j]<p){int t=a[i];a[i++]=a[j];a[j]=t;}
  int t=a[i];a[i]=a[h];a[h]=t;
  qs(a,l,i-1); qs(a,i+1,h);
}`],

  return true;
}
boolean[] comp=new boolean[n+1]; // sieve: true = not prime
for(int i=2;(long)i*i<=n;i++) if(!comp[i])
  for(int j=i*i;j<=n;j+=i) comp[j]=true;`],
["GCD & LCM","Euclid",`int gcd(int a,int b){ return b==0?a:gcd(b,a%b); }
long lcm(int a,int b){ return (long)a/gcd(a,b)*b; }`],

int sum=0,len=String.valueOf(n).length();

boolean arm=(sum==n);                 // Armstrong
long f=1; for(int i=2;i<=k;i++) f*=i; // factorial`],
["Pattern Printing","Nested loops / String.repeat",`for(int i=1;i<=n;i++)

["Number System Conversion","Decimal ↔ binary",`String s="";

String b=Integer.toBinaryString(n);   // built-in
int d=Integer.parseInt("1010",2);     // binary → decimal (10)`]]},
"Recursion":{tip:"Template: base case → choose → recurse → un-choose (backtrack). Time = branches^depth. Pehle state aur choices likho.",
items:[
["Subsets","Include / exclude. O(2^n)",`void sub(int[] a,int i,List<Integer> cur,List<List<Integer>> res){
  if(i==a.length){res.add(new ArrayList<>(cur));return;}
  cur.add(a[i]); sub(a,i+1,cur,res);   // include
  cur.remove(cur.size()-1); sub(a,i+1,cur,res); // exclude
}`],
["Permutations","Used[] array se. O(n!·n)",`void perm(int[] a,boolean[] u,List<Integer> cur,List<List<Integer>> res){
  if(cur.size()==a.length){res.add(new ArrayList<>(cur));return;}
  for(int i=0;i<a.length;i++){
    if(u[i])continue;
    u[i]=true;cur.add(a[i]);
    perm(a,u,cur,res);
    cur.remove(cur.size()-1);u[i]=false;
  }
}`],
["Combination Sum","Reuse allowed → recurse with same i",`void comb(int[] a,int i,int t,List<Integer> cur,List<List<Integer>> res){
  if(t==0){res.add(new ArrayList<>(cur));return;}
  if(t<0||i==a.length)return;
  cur.add(a[i]); comb(a,i,t-a[i],cur,res);
  cur.remove(cur.size()-1); comb(a,i+1,t,cur,res);
}`],
["N-Queens","Row by row; col, diag, anti-diag sets",`int cnt=0;
void solve(int r,int n,boolean[] c,boolean[] d1,boolean[] d2){
  if(r==n){cnt++;return;}
  for(int j=0;j<n;j++){
    if(c[j]||d1[r+j]||d2[r-j+n-1])continue;
    c[j]=d1[r+j]=d2[r-j+n-1]=true;
    solve(r+1,n,c,d1,d2);
    c[j]=d1[r+j]=d2[r-j+n-1]=false;
  }
}`],
["Tower of Hanoi","2^n − 1 moves",`void hanoi(int n,char a,char b,char c){
  if(n==0)return;
  hanoi(n-1,a,c,b);
  System.out.println(a+"->"+c);
  hanoi(n-1,b,a,c);
}`],
["Sudoku / Word Search","Same backtracking: try → recurse → undo",`boolean exist(char[][] g,String w,int i,int j,int k){
  if(k==w.length())return true;
  if(i<0||j<0||i>=g.length||j>=g[0].length||g[i][j]!=w.charAt(k))return false;
  char t=g[i][j];g[i][j]='#';
  boolean f=exist(g,w,i+1,j,k+1)||exist(g,w,i-1,j,k+1)
         ||exist(g,w,i,j+1,k+1)||exist(g,w,i,j-1,k+1);
  g[i][j]=t;return f;
}`]]},
"Trees":{tip:"Almost sab recursion hai: solve(left), solve(right), combine. BST inorder = sorted. Level order = BFS with queue.",
items:[
["Traversals","Pre / In / Post (DFS)",`class Node{int val;Node left,right;Node(int v){val=v;}}
void in(Node r){ if(r==null)return; in(r.left); System.out.print(r.val); in(r.right); }
// pre: print → L → R   |  post: L → R → print`],
["Level Order (BFS)","Queue + level size",`List<List<Integer>> level(Node r){
  List<List<Integer>> res=new ArrayList<>(); if(r==null)return res;
  Queue<Node> q=new LinkedList<>(); q.add(r);
  while(!q.isEmpty()){
    int s=q.size(); List<Integer> l=new ArrayList<>();
    while(s-->0){Node n=q.poll();l.add(n.val);
      if(n.left!=null)q.add(n.left); if(n.right!=null)q.add(n.right);}
    res.add(l);
  }
  return res;
}`],
["Height & Diameter","Diameter = max(lh + rh) at any node",`int best=0;
int h(Node r){
  if(r==null)return 0;
  int l=h(r.left), rt=h(r.right);
  best=Math.max(best,l+rt);      // diameter (edges)
  return 1+Math.max(l,rt);
}`],
["Lowest Common Ancestor","Dono side mile → current node LCA",`Node lca(Node r,Node p,Node q){
  if(r==null||r==p||r==q)return r;
  Node l=lca(r.left,p,q), rt=lca(r.right,p,q);
  return (l!=null&&rt!=null)?r:(l!=null?l:rt);
}`],
["Validate BST","Range (min,max) pass karo",`boolean ok(Node r,long lo,long hi){
  if(r==null)return true;
  if(r.val<=lo||r.val>=hi)return false;
  return ok(r.left,lo,r.val)&&ok(r.right,r.val,hi);
}  // call: ok(root,Long.MIN_VALUE,Long.MAX_VALUE)`],
["Max Path Sum","Gain = max(0, child gain)",`int max=Integer.MIN_VALUE;
int gain(Node r){
  if(r==null)return 0;
  int l=Math.max(0,gain(r.left)), rt=Math.max(0,gain(r.right));
  max=Math.max(max,r.val+l+rt);
  return r.val+Math.max(l,rt);
}`],
["Invert / Symmetric / Same Tree","Simple recursion trio",`Node invert(Node r){
  if(r==null)return null;
  Node t=r.left; r.left=invert(r.right); r.right=invert(t); return r;
}
boolean same(Node a,Node b){
  if(a==null||b==null)return a==b;
  return a.val==b.val&&same(a.left,b.left)&&same(a.right,b.right);
}  // symmetric: mirror(a.left,a.right) with a.left↔b.right`]]},
"Graphs":{tip:"Representation: List<List<Integer>> adj. Shortest path unweighted → BFS; weighted → Dijkstra; dependencies → Topo sort; components → DSU/DFS.",
items:[
["BFS / DFS","O(V+E)",`List<List<Integer>> adj; // adj.get(u) = neighbours
void bfs(int s,int n){
  boolean[] vis=new boolean[n]; Queue<Integer> q=new LinkedList<>();
  q.add(s); vis[s]=true;
  while(!q.isEmpty()){int u=q.poll();
    for(int v:adj.get(u)) if(!vis[v]){vis[v]=true;q.add(v);}}
}
void dfs(int u,boolean[] vis){
  vis[u]=true;
  for(int v:adj.get(u)) if(!vis[v]) dfs(v,vis);
}`],
["Number of Islands","Grid DFS, sink visited cells",`int islands(char[][] g){
  int c=0;
  for(int i=0;i<g.length;i++)for(int j=0;j<g[0].length;j++)
    if(g[i][j]=='1'){c++;sink(g,i,j);}
  return c;
}
void sink(char[][] g,int i,int j){
  if(i<0||j<0||i>=g.length||j>=g[0].length||g[i][j]!='1')return;
  g[i][j]='0'; sink(g,i+1,j);sink(g,i-1,j);sink(g,i,j+1);sink(g,i,j-1);
}`],

"Tower of Hanoi":`void hanoi(int n,char a,char b,char c){
  if(n==0) return;
  hanoi(n-1,a,c,b);
  cout<<a<<"->"<<c<<endl;
  hanoi(n-1,b,a,c);
}`,
"Sudoku / Word Search":`bool exist(vector<vector<char>>&g,string&w,int i,int j,int k){
  if(k==w.size()) return true;
  if(i<0||j<0||i>=g.size()||j>=g[0].size()||g[i][j]!=w[k]) return false;
  char t=g[i][j]; g[i][j]='#';
  bool f=exist(g,w,i+1,j,k+1)||exist(g,w,i-1,j,k+1)
      ||exist(g,w,i,j+1,k+1)||exist(g,w,i,j-1,k+1);
  g[i][j]=t; return f;
}`,
"Traversals":`struct Node{int val;Node*left=nullptr,*right=nullptr;Node(int v):val(v){}};
void in(Node*r){ if(!r)return; in(r->left); cout<<r->val<<" "; in(r->right); }
// pre: print → L → R   |  post: L → R → print`,
"Level Order (BFS)":`vector<vector<int>> level(Node*r){
  vector<vector<int>> res; if(!r) return res;
  queue<Node*> q; q.push(r);
  while(!q.empty()){
    int s=q.size(); vector<int> l;
    while(s--){Node*n=q.front();q.pop();l.push_back(n->val);
      if(n->left)q.push(n->left); if(n->right)q.push(n->right);}
    res.push_back(l);
  }
  return res;
}`,
"Height & Diameter":`int best=0;
int h(Node*r){
  if(!r) return 0;
  int l=h(r->left), rt=h(r->right);
  best=max(best,l+rt);      // diameter (edges)
  return 1+max(l,rt);
}`,
"Lowest Common Ancestor":`Node* lca(Node*r,Node*p,Node*q){
  if(!r||r==p||r==q) return r;
  Node*l=lca(r->left,p,q),*rt=lca(r->right,p,q);
  return (l&&rt)?r:(l?l:rt);
}`,
"Validate BST":`bool ok(Node*r,long long lo,long long hi){
  if(!r) return true;
  if(r->val<=lo||r->val>=hi) return false;
  return ok(r->left,lo,r->val)&&ok(r->right,r->val,hi);
}  // call: ok(root,LLONG_MIN,LLONG_MAX)`,
"Max Path Sum":`int mx=INT_MIN;
int gain(Node*r){
  if(!r) return 0;
  int l=max(0,gain(r->left)), rt=max(0,gain(r->right));
  mx=max(mx,r->val+l+rt);
  return r->val+max(l,rt);
}`,
"Invert / Symmetric / Same Tree":`Node* invert(Node*r){
  if(!r) return nullptr;
  Node*t=r->left; r->left=invert(r->right); r->right=invert(t); return r;
}
bool same(Node*a,Node*b){
  if(!a||!b) return a==b;
  return a->val==b->val&&same(a->left,b->left)&&same(a->right,b->right);
}  // symmetric: mirror(a->left,a->right) with a->left↔b->right`,
"BFS / DFS":`vector<vector<int>> adj; // adj[u] = neighbours
void bfs(int s,int n){
  vector<bool> vis(n,false); queue<int> q;
  q.push(s); vis[s]=true;
  while(!q.empty()){int u=q.front();q.pop();
    for(int v:adj[u]) if(!vis[v]){vis[v]=true;q.push(v);}}
}
void dfs(int u,vector<bool>&vis){
  vis[u]=true;
  for(int v:adj[u]) if(!vis[v]) dfs(v,vis);
}`,
"Number of Islands":`void sink(vector<vector<char>>&g,int i,int j){
  if(i<0||j<0||i>=g.size()||j>=g[0].size()||g[i][j]!='1') return;
  g[i][j]='0'; sink(g,i+1,j);sink(g,i-1,j);sink(g,i,j+1);sink(g,i,j-1);
}
int islands(vector<vector<char>>&g){
  int c=0;
  for(int i=0;i<g.size();i++)for(int j=0;j<g[0].size();j++)
    if(g[i][j]=='1'){c++;sink(g,i,j);}
  return c;
}`,
"Topological Sort (Kahn)":`vector<int> topo(int n,vector<vector<int>>&adj){
  vector<int> in(n,0),ord;
  for(auto&l:adj) for(int v:l) in[v]++;
  queue<int> q;
  for(int i=0;i<n;i++) if(!in[i]) q.push(i);
  while(!q.empty()){int u=q.front();q.pop();ord.push_back(u);
    for(int v:adj[u]) if(--in[v]==0) q.push(v);}
  return ord;
}`,
"Cycle Detection":`bool cyc(int u,vector<int>&st){ // 0=new,1=in stack,2=done
  st[u]=1;
  for(int v:adj[u]){
    if(st[v]==1) return true;
    if(st[v]==0&&cyc(v,st)) return true;
  }
  st[u]=2; return false;
}`,
"Dijkstra":`vector<int> dijkstra(int s,int n,vector<vector<pair<int,int>>>&adj){ // {v,w}
  vector<int> d(n,INT_MAX); d[s]=0;
  priority_queue<pair<int,int>,vector<pair<int,int>>,greater<>> pq;
  pq.push({0,s});
  while(!pq.empty()){
    auto [du,u]=pq.top(); pq.pop();
    if(du>d[u]) continue;
    for(auto [v,w]:adj[u])
      if(d[u]+w<d[v]){d[v]=d[u]+w;pq.push({d[v],v});}
  }
  return d;
}`,
"Union-Find (DSU)":`vector<int> p;  // init: iota(p.begin(),p.end(),0)
int find(int x){ return p[x]==x?x:p[x]=find(p[x]); }
bool unite(int a,int b){
  a=find(a); b=find(b);
  if(a==b) return false;   // already connected → cycle
  p[a]=b; return true;
}`,
"Clone Graph / Bipartite / Rotten Oranges":`bool bip(int s,vector<int>&col){ // col init -1
  queue<int> q; q.push(s); col[s]=0;
  while(!q.empty()){int u=q.front();q.pop();
    for(int v:adj[u]){
      if(col[v]==-1){col[v]=1-col[u];q.push(v);}
      else if(col[v]==col[u]) return false;}}
  return true;
}`,
"Fibonacci / Climbing Stairs":`int climb(int n){
  int a=1,b=1;
  for(int i=2;i<=n;i++){int c=a+b;a=b;b=c;}
  return b;
}`,
"House Robber":`int rob(vector<int>&a){
  int p=0,c=0;
  for(int x:a){int t=max(c,p+x);p=c;c=t;}
  return c;
}`,
"Kadane (Max Subarray)":`int kadane(vector<int>&a){
  int cur=a[0],best=a[0];
  for(int i=1;i<a.size();i++){cur=max(a[i],cur+a[i]);best=max(best,cur);}
  return best;
}`,
"0/1 Knapsack":`int knap(vector<int>&w,vector<int>&v,int W){
  vector<int> dp(W+1,0);
  for(int i=0;i<w.size();i++)
    for(int c=W;c>=w[i];c--)
      dp[c]=max(dp[c],v[i]+dp[c-w[i]]);
  return dp[W];
}  // Subset sum, partition equal subset = same pattern`,
"Coin Change":`int coin(vector<int>&cs,int amt){
  vector<int> dp(amt+1,amt+1); dp[0]=0;
  for(int i=1;i<=amt;i++)
    for(int c:cs) if(c<=i) dp[i]=min(dp[i],dp[i-c]+1);
  return dp[amt]>amt?-1:dp[amt];
}  // ways count: for(c) for(i) dp[i]+=dp[i-c]`,
"Longest Increasing Subsequence":`int lis(vector<int>&a){
  vector<int> t;
  for(int x:a){
    auto it=lower_bound(t.begin(),t.end(),x);
    if(it==t.end()) t.push_back(x); else *it=x;
  }
  return t.size();
}`,
"Longest Common Subsequence":`int lcs(string&a,string&b){
  int n=a.size(),m=b.size(); vector<vector<int>> dp(n+1,vector<int>(m+1,0));
  for(int i=1;i<=n;i++)for(int j=1;j<=m;j++)
    dp[i][j]=a[i-1]==b[j-1]?dp[i-1][j-1]+1:max(dp[i-1][j],dp[i][j-1]);
  return dp[n][m];
}  // LPS = lcs(s, reverse(s))`,
"Edit Distance":`int edit(string&a,string&b){
  int n=a.size(),m=b.size(); vector<vector<int>> dp(n+1,vector<int>(m+1,0));
  for(int i=0;i<=n;i++)dp[i][0]=i; for(int j=0;j<=m;j++)dp[0][j]=j;
  for(int i=1;i<=n;i++)for(int j=1;j<=m;j++)
    dp[i][j]=a[i-1]==b[j-1]?dp[i-1][j-1]
      :1+min({dp[i-1][j-1],dp[i-1][j],dp[i][j-1]});
  return dp[n][m];
}`,
"Grid Paths / Min Path Sum":`int minPath(vector<vector<int>>&g){
  int n=g.size(),m=g[0].size();
  for(int i=0;i<n;i++)for(int j=0;j<m;j++){
    if(!i&&!j) continue;
    int up=i?g[i-1][j]:INT_MAX, left=j?g[i][j-1]:INT_MAX;
    g[i][j]+=min(up,left);
  }
  return g[n-1][m-1];
}  // unique paths: dp[i][j]=dp[i-1][j]+dp[i][j-1]`,
"Memoization Template":`vector<int> memo(100,-1);
int f(int n){
  if(n<=1) return n;
  if(memo[n]!=-1) return memo[n];
  return memo[n]=f(n-1)+f(n-2);
}

const TC={"Arrays & Strings":"Capgemini-level basics. Edge cases check karo: empty, 1 element, negatives, duplicates. Strings: s[i], s.size(), substr(), reverse(), sort().",
"Stack & Queue":"C++: stack<int> st (push/pop/top), queue<int> q (push/front/pop). Matching / next greater → stack."};
const $=x=>document.getElementById(x);
const L=()=>st.lang==='cpp'?'cpp':'java';
const nav=$('nav'),m=$('m'),q=$('q'),bar=$('bar'),pt=$('pt');
const KEY='dsa-cheat-v1';
let st={done:{},star:{},note:{},theme:''};
try{st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
let cur=decodeURIComponent(location.hash.slice(1));
if(!D[cur])cur=Object.keys(D)[0];
let onlyStar=false,hideDone=false;
const id=(t,a)=>t+'|'+a;
function hl(c){
  const e=c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(/(\/\/.*)|("(?:[^"\\]|\\.)*")|\b(int|long|char|boolean|void|String|class|new|return|if|else|for|while|null|true|false|static|public|private|final|double|break|continue|bool|vector|unordered_map|unordered_set|map|set|auto|struct|nullptr|const|queue|stack|priority_queue|pair|string)\b|\b(\d+)\b/g,
    (x,cm,s,k,n)=>cm?'<i class=c>'+cm+'</i>':s?'<i class=s>'+s+'</i>':k?'<i class=k>'+k+'</i>':'<i class=n>'+n+'</i>');
}
function stats(t){const it=D[t].items;return[it.filter(x=>st.done[id(t,x[0])]).length,it.length];}
function updProg(){
  let d=0,t=0;
  Object.keys(D).forEach(k=>{const[a,b]=stats(k);d+=a;t+=b;});
  bar.style.width=(t?d/t*100:0)+'%';pt.textContent=d+' / '+t+' solved';
  [...nav.children].forEach(b=>{const[x,y]=stats(b.dataset.k);b.textContent=b.dataset.k+' '+x+'/'+y;b.classList.toggle('on',b.dataset.k===cur);});
}
function render(){
  const f=q.value.toLowerCase();m.innerHTML='';
  const t=document.createElement('div');t.className='tip';t.textContent=(L()==='cpp'&&TC[cur]||D[cur].tip)+(L()==='cpp'?'  [C++: #include <bits/stdc++.h> + using namespace std;]':'');m.append(t);
  let shown=0;
  D[cur].items.forEach(([a,b,j])=>{const miss=L()==='cpp'&&!C[a];const c=L()==='cpp'&&C[a]?C[a]:j;
    const k=id(cur,a);
    if(f&&!(a+b+c+(S[a]||'')).toLowerCase().includes(f))return;
    if(onlyStar&&!st.star[k])return;
    if(hideDone&&st.done[k])return;
    shown++;
    const d=document.createElement('details');if(f)d.open=true;
    d.className=st.done[k]?'done':'';
    d.innerHTML='<summary><input type=checkbox class=ck title="Mark solved"><span class=ti></span><small></small><button class=st title=Star>★</button></summary><p><b>Problem: </b><span class=ps></span></p><div class=cw><button class=cp>Copy</button><pre></pre></div><textarea placeholder="Your notes..."></textarea>';
    const Q=s=>d.querySelector(s);
    Q('.ti').textContent=a;Q('small').textContent=b+(miss?' · Java shown':'');Q('.ps').textContent=S[a]||'';
    Q('pre').innerHTML=hl(c);
    const ck=Q('.ck');ck.checked=!!st.done[k];
    ck.onclick=e=>{e.stopPropagation();if(ck.checked)st.done[k]=1;else delete st.done[k];save();d.classList.toggle('done',ck.checked);updProg();};
    const sb=Q('.st');sb.classList.toggle('on',!!st.star[k]);
    sb.onclick=e=>{e.preventDefault();e.stopPropagation();if(st.star[k])delete st.star[k];else st.star[k]=1;save();sb.classList.toggle('on',!!st.star[k]);};
    Q('.cp').onclick=e=>{const bt=e.target;navigator.clipboard&&navigator.clipboard.writeText(c).then(()=>{bt.textContent='Copied!';setTimeout(()=>bt.textContent='Copy',1200);});};
    const ta=Q('textarea');ta.value=st.note[k]||'';
    ta.oninput=()=>{if(ta.value)st.note[k]=ta.value;else delete st.note[k];save();};
    m.append(d);
  });
  if(!shown){const e=document.createElement('div');e.className='tip';e.textContent='Kuch nahi mila.';m.append(e);}
  updProg();
}
function setLang(){$('lg').textContent='Lang: '+(L()==='cpp'?'C++':'Java');$('lt').textContent=L()==='cpp'?'C++':'Java';}
$('lg').onclick=()=>{st.lang=L()==='cpp'?'java':'cpp';save();setLang();render();};

Object.keys(D).forEach(k=>{const b=document.createElement('button');b.dataset.k=k;b.onclick=()=>{cur=k;location.hash=encodeURIComponent(k);render();};nav.append(b);});

$('fs').onclick=e=>{onlyStar=!onlyStar;e.target.classList.toggle('on',onlyStar);render();};
$('fh').onclick=e=>{hideDone=!hideDone;e.target.classList.toggle('on',hideDone);render();};
$('th').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;st.theme=dk?'light':'dark';applyTheme();save();};
$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:'application/json'}));a.download='dsa-progress.json';a.click();};
$('im').onchange=e=>{const r=new FileReader();r.onload=()=>{try{st=Object.assign(st,JSON.parse(r.result));save();applyTheme();render();}catch(x){alert('Invalid file');}};r.readAsText(e.target.files[0]);};
$('rs').onclick=()=>{if(confirm('Reset all progress, stars and notes?')){st={done:{},star:{},note:{},theme:st.theme,lang:st.lang};save();render();}};
addEventListener('keydown',e=>{const t=document.activeElement.tagName;if(e.key==='/'&&t!=='INPUT'&&t!=='TEXTAREA'){e.preventDefault();q.focus();}});
